[package]
name = "rust_gps_ntp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10"
log = "0.4"
portable-atomic = "1"

[target.'cfg(target_os = "espidf")'.dependencies]
display-interface = "0.4"
display-interface-spi = "0.4"
embedded-graphics = "0.7"
embedded-svc = "0.28"
embedded-hal-02 = { package = "embedded-hal", version = "0.2" }
esp-idf-svc = { version = "0.51", features = ["std", "binstart", "experimental"] }
st7789 = "0.7"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[features]
bench = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serial_test = "3"

[[bench]]
name = "gps_parse"
harness = false

[[bench]]
name = "ntp_poll"
harness = false
required-features = ["bench"]

# Unsafe-code discipline. Every `unsafe` block is an FFI call into ESP-IDF;
# each must carry a `// SAFETY:` comment stating why the C preconditions hold,
# and clippy fails the build if one is missing. Applies to all targets.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"
